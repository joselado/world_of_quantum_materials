<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- A phone browser must not zoom or scroll the page under the canvas:
       the game fills the viewport and reads every touch itself, so a
       double-tap or a drag on the walking arrows would otherwise pinch or
       pan the page instead of walking. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>World of Quantum Materials</title>
  <!-- The player's own crystal, as a data URI rather than a file: this game
       ships no image assets (every sprite is drawn at runtime), and the
       standalone single-file build has nowhere to fetch one from anyway. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 30,16 16,30 2,16' fill='%233fb8d8'/%3E%3Cpolygon points='16,2 30,16 16,16' fill='%238fe6f5'/%3E%3Cpolygon points='16,2 2,16 16,16' fill='%2364d2ea'/%3E%3C/svg%3E"
  />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
    body { display: block; }
    #game { width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
